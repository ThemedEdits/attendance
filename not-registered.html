<body>
  <div class="auth-shell">
    <div class="auth-panel" style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;">
      <div class="auth-card" style="max-width:520px;text-align:center;">
        <img class="site-logo site-logo--header" src="logo.svg" alt="Attendance Register" style="margin:0 auto 2rem;">
        <div class="eyebrow-label">Account setup</div>
        <h1 class="page-title" style="margin-bottom:.75rem;">Finish your profile</h1>
        <p class="page-sub" id="who">Your account is authenticated. Continue to role setup to request the access you need.</p>
        <div class="email-pill-display" id="user-pill"><span id="user-email-text">Checking authentication...</span></div>
        <a class="btn btn-primary" href="student-onboarding.html" style="width:100%;margin-top:1rem;">Continue to profile setup</a>
        <button class="btn btn-outline" id="signout-btn" type="button" style="width:100%;margin-top:.75rem;">Sign out</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/not-registered.js"></script>
</body>
