<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Attendance · Attendance Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Attendance Register" />
<link rel="manifest" href="/site.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="app-header__brand">
      <div class="brand-icon-sq" style="width:30px;height:30px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
        </svg>
      </div>
      <span>Attendance Register</span>
    </div>

    <!-- Mobile Hamburger Toggle -->
    <button type="button" class="header-hamburger-btn" id="mobile-menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div class="app-header__who" id="app-header-nav">
      <span class="role-badge" style="background:#ecfdf5;color:#047857;border-color:#a7f3d0;">Student</span>
      <div class="user-profile-badge">
        <div class="user-avatar-circle" id="user-avatar">S</div>
        <span class="user-email-text" id="user-name">Loading…</span>
      </div>
      <button class="btn-ghost" id="signout-btn" title="Sign out of account">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
        </svg>
        <span>Sign out</span>
      </button>
    </div>
  </header>

  <main class="container">
    <div class="page-header-row">
      <div>
        <h1 class="page-title">Your Attendance</h1>
        <p class="page-sub" id="page-sub">View your official attendance rate, presence records, and course breakdown.</p>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="filters-bar" style="margin-bottom: 2rem;">
      <div class="field" style="max-width: 320px;">
        <label for="subject-filter">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/>
          </svg>
          Filter by Subject
        </label>
        <select id="subject-filter">
          <option value="">All subjects</option>
        </select>
      </div>
    </div>

    <!-- Live Stat Cards Grid -->
    <div class="stat-grid" id="stat-row">
      <!-- Generated dynamically -->
    </div>

    <!-- Attendance History Table -->
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>
            <span class="panel-icon-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z"/>
              </svg>
            </span>
            Attendance Log
          </h2>
          <p>Chronological record of every session marked by your course instructors.</p>
        </div>
      </div>

      <div id="table-wrap">
        <div class="spinner-row">
          <span class="modern-spinner"></span>
          <span>Loading your attendance records…</span>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-root" class="toast-container"></div>

  <script type="module" src="js/student.js"></script>
</body>
</html>
